envVarGroups:
  - name: sportsgirl-beauty-radar-secrets
    envVars:
      - key: MARKET_MODE
        value: global_validated
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_MAX_ITEMS_PER_QUERY
        value: "60"
      - key: APIFY_DEEP_COMMENT_POST_LIMIT
        value: "10"
      - key: APIFY_SHALLOW_COMMENT_LIMIT
        value: "15"
      - key: APIFY_DEEP_COMMENT_LIMIT
        value: "60"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: nitin4747@gmail.com
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

services:
  - type: web
    name: sportsgirl-beauty-radar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - fromGroup: sportsgirl-beauty-radar-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: sportsgirl-beauty-radar-db
          property: connectionString

  - type: cron
    name: sportsgirl-beauty-radar-ingest
    runtime: node
    plan: starter
    # 18:00 UTC = before 6am AEST next day, well before the AU business day.
    # Render cron is UTC-only, no DST awareness -- during AEDT this lands an
    # hour later local time; acceptable slack for a "before business day"
    # target, revisit if a tighter window is needed.
    schedule: "0 18 * * *"
    buildCommand: npm install
    startCommand: node src/ingest.js
    envVars:
      - fromGroup: sportsgirl-beauty-radar-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: sportsgirl-beauty-radar-db
          property: connectionString

databases:
  - name: sportsgirl-beauty-radar-db
    plan: basic-1gb
    databaseName: sportsgirl_beauty_radar
    user: sportsgirl
