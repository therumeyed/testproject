envVarGroups:
  - name: melair-mentions-secrets
    envVars:
      - key: SEARCH_QUERY
        value: Melbourne Airport
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_REDDIT_SUBREDDITS
        value: melbourne,australia
      - key: APIFY_GOOGLE_PLACE_IDS
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: IG_BUSINESS_ACCOUNT_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        value: nitin@alleygroup.com.au

services:
  - type: web
    name: melair-mentions-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - fromGroup: melair-mentions-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: melair-mentions-db
          property: connectionString

  - type: cron
    name: melair-mentions-ingest
    runtime: node
    plan: starter
    schedule: "0 20 * * *" # 20:00 UTC = 6am (AEST) / 7am (AEDT) Melbourne
    buildCommand: npm install
    startCommand: node src/ingest.js
    envVars:
      - fromGroup: melair-mentions-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: melair-mentions-db
          property: connectionString

databases:
  - name: melair-mentions-db
    plan: basic-1gb
    databaseName: melair_mentions
    user: melair
