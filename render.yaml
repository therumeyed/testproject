envVarGroups:
  - name: sportsgirl-beauty-radar-secrets
    envVars:
      - key: MARKET_MODE
        value: global_validated
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_MAX_ITEMS_PER_QUERY
        value: "60"
      - key: APIFY_MAX_QUERIES_PER_RUN
        value: "20"
      - key: APIFY_DEEP_COMMENT_POST_LIMIT
        value: "10"
      - key: APIFY_SHALLOW_COMMENT_LIMIT
        value: "15"
      - key: APIFY_DEEP_COMMENT_LIMIT
        value: "60"
      - key: ANTHROPIC_API_KEY
        sync: false
      # No login gate -- open to anyone with the service URL, by request.
      # ADMIN_EMAILS is only used to attribute audit-log/workflow-action
      # entries to a default identity, not for access control.
      - key: ADMIN_EMAILS
        value: nitin4747@gmail.com

services:
  - type: web
    name: sportsgirl-beauty-radar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - fromGroup: sportsgirl-beauty-radar-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: sportsgirl-beauty-radar-db
          property: connectionString

  # PAUSED (2026-08-10) to stop nightly Anthropic/Apify spend while manually
  # re-tuning cost/quality via Admin -- see README "Cost control". Render
  # Blueprint sync does NOT delete/suspend an already-created cron service
  # just because it's removed from this file; you must also manually
  # suspend "sportsgirl-beauty-radar-ingest" in the Render dashboard
  # (Cron Job -> Settings -> Suspend), otherwise the existing schedule
  # keeps firing regardless of this edit. Uncomment + redeploy + resume in
  # the dashboard to re-enable.
  # - type: cron
  #   name: sportsgirl-beauty-radar-ingest
  #   runtime: node
  #   plan: starter
  #   # 18:00 UTC = before 6am AEST next day, well before the AU business day.
  #   # Render cron is UTC-only, no DST awareness -- during AEDT this lands an
  #   # hour later local time; acceptable slack for a "before business day"
  #   # target, revisit if a tighter window is needed.
  #   schedule: "0 18 * * *"
  #   buildCommand: npm install
  #   startCommand: node src/ingest.js
  #   envVars:
  #     - fromGroup: sportsgirl-beauty-radar-secrets
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: sportsgirl-beauty-radar-db
  #         property: connectionString

databases:
  - name: sportsgirl-beauty-radar-db
    plan: basic-1gb
    databaseName: sportsgirl_beauty_radar
    user: sportsgirl
