<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in — Sportsgirl Beauty Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-shell">
  <h1>Sportsgirl Beauty Radar</h1>
  <p class="subtitle">Sign in with your email and the shared access password to continue.</p>
  <div class="card">
    <input id="email" type="email" placeholder="you@sportsgirl.com.au" autocomplete="email" />
    <input id="password" type="password" placeholder="Access password" autocomplete="current-password" />
    <button id="submit" style="width:100%;">Sign in</button>
    <div class="error-text" id="error" style="display:none;"></div>
  </div>
</div>
<script>
async function submit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errorEl.textContent = body.error === 'invalid_password' ? 'Incorrect password.' : (body.error || 'Sign in failed.');
      errorEl.style.display = 'block';
      return;
    }
    window.location.href = '/index.html';
  } catch (err) {
    errorEl.textContent = 'Could not reach the server.';
    errorEl.style.display = 'block';
  }
}
document.getElementById('submit').addEventListener('click', submit);
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
