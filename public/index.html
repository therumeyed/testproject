<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Overview — Sportsgirl Beauty Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="wrap">
  <h1>What's moving in Sportsgirl Beauty</h1>
  <p class="subtitle" id="subhead">Loading…</p>

  <div class="stat-row" id="stats"></div>

  <div class="section-head"><h2>Act now</h2></div>
  <div class="card-grid" id="actNow"><div class="loading">Loading…</div></div>

  <div class="section-head"><h2>Post this week</h2><a href="/social-desk.html">Open Social Content Desk →</a></div>
  <div class="card-grid" id="postWeek"><div class="loading">Loading…</div></div>

  <div class="section-head"><h2>Buying opportunities</h2><a href="/buying-desk.html">Open Buying Desk →</a></div>
  <div class="card-grid" id="buyingOpps"><div class="loading">Loading…</div></div>

  <div class="section-head"><h2>Watchlist — not yet validated</h2></div>
  <div class="card-grid" id="watchlist"><div class="loading">Loading…</div></div>
</div>

<script src="/js/app.js"></script>
<script>
(async function () {
  await initPage('/index.html');

  const [trends, health, socialRecs, buyingRecs] = await Promise.all([
    api('/api/trends'), api('/api/source-health'), api('/api/recommendations?type=social_idea'), api('/api/recommendations?type=buying_opportunity')
  ]);

  const counts = { new_signal: 0, emerging: 0, accelerating: 0, peaking: 0, sustained: 0, cooling: 0, recurring_seasonal: 0 };
  trends.forEach((t) => { if (counts[t.lifecycleStage] !== undefined) counts[t.lifecycleStage]++; });

  const lastRun = health.reduce((latest, h) => (!latest || (h.finished_at && h.finished_at > latest)) ? h.finished_at : latest, null);
  const healthyCount = health.filter((h) => h.status === 'success').length;
  document.getElementById('subhead').textContent =
    `Last updated ${lastRun ? new Date(lastRun).toLocaleString('en-AU') : 'never'} · ${healthyCount}/${health.length || 4} sources healthy · ${trends.length} active trends tracked`;

  document.getElementById('stats').innerHTML = `
    <div class="stat-tile"><div class="n">${counts.new_signal + counts.emerging}</div><div class="l">New / emerging</div></div>
    <div class="stat-tile"><div class="n">${counts.accelerating + counts.peaking}</div><div class="l">Accelerating / peaking</div></div>
    <div class="stat-tile"><div class="n">${counts.sustained + counts.recurring_seasonal}</div><div class="l">Sustained / seasonal</div></div>
    <div class="stat-tile"><div class="n">${counts.cooling}</div><div class="l">Cooling</div></div>
  `;

  const actNow = [...trends]
    .filter((t) => ['post_now', 'create_social_series', 'investigate_buying', 'test_small_run', 'feature_product'].includes(t.recommendedAction))
    .sort((a, b) => (b.socialScore + b.buyingScore) - (a.socialScore + a.buyingScore))
    .slice(0, 5);
  document.getElementById('actNow').innerHTML = actNow.length ? actNow.map(trendCardHtml).join('') : '<div class="empty">No trends have cleared the action threshold yet.</div>';

  function socialIdeaCard(r) {
    const p = r.payload;
    return `<a href="/trend.html?id=${r.trend_id}" class="card" style="display:block;color:inherit;">
      <div class="top-row"><div class="name">${esc(p.title)}</div><span class="badge neutral">${esc(p.format || '')}</span></div>
      <div class="def">${esc(p.hook || '')}</div>
      <div class="meta-row"><span>Trend: ${esc(r.trend_name)}</span> · <span>Effort: ${esc(p.effortLevel || '—')}</span> · <span>Shelf life: ${esc(p.shelfLife || '—')}</span></div>
      <div class="evidence-line">Status: ${esc(r.status)}</div>
    </a>`;
  }
  const postWeek = socialRecs.slice(0, 6);
  document.getElementById('postWeek').innerHTML = postWeek.length ? postWeek.map(socialIdeaCard).join('') : '<div class="empty">No supported social ideas yet -- check back after the next ingest run.</div>';

  function buyingCard(r) {
    const p = r.payload;
    return `<a href="/trend.html?id=${r.trend_id}" class="card" style="display:block;color:inherit;">
      <div class="top-row"><div class="name">${esc(p.productOpportunity)}</div>${auBadge(r.market_au_state)}</div>
      <div class="def">${esc(p.attributes || '')}</div>
      <div class="meta-row"><span>Trend: ${esc(r.trend_name)}</span> · <span>${r.consecutive_active_days || 0}d consecutive</span> · <span>Lead-time risk: ${esc(p.leadTimeRisk || '—')}</span></div>
      <div class="evidence-line">${esc(p.opportunityWindow || '')}</div>
      <div class="action">Suggested: ${esc((p.suggestedAction || '').replace(/_/g, ' '))}</div>
    </a>`;
  }
  const buying = buyingRecs.slice(0, 6);
  document.getElementById('buyingOpps').innerHTML = buying.length ? buying.map(buyingCard).join('') : '<div class="empty">No buying opportunities generated yet.</div>';

  const watchlist = trends.filter((t) => t.lifecycleStage === 'new_signal' || (t.isProvisional && t.confidenceScore < 50)).slice(0, 6);
  document.getElementById('watchlist').innerHTML = watchlist.length
    ? watchlist.map((t) => `<a href="/trend.html?id=${t.id}" class="card" style="display:block;color:inherit;">
        <div class="top-row"><div class="name">${esc(t.name)}</div>${stageBadge(t.lifecycleStage)}</div>
        <div class="def">${esc(t.definition || '')}</div>
        <div class="evidence-line">Needs: more independent creators, cross-platform confirmation, and/or Australian evidence before this is validated.</div>
      </a>`).join('')
    : '<div class="empty">Nothing on the watchlist right now.</div>';
})();
</script>
</body>
</html>
