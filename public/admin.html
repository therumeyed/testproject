<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin — Sportsgirl Beauty Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="wrap">
  <div class="section-head">
    <div><h1>Admin / Tracking Settings</h1><p class="subtitle">Taxonomy, thresholds, sources and governance.</p></div>
    <div style="display:flex;gap:8px;">
      <button id="stopRun" class="secondary" style="display:none;background:var(--bad-soft);color:var(--bad);border-color:var(--bad);">Stop run</button>
    </div>
  </div>
  <!--
    "Run collection now" / "Cluster & score existing data" buttons removed
    (2026-08-10) -- this page has no login gate, so anyone with the URL
    (e.g. Sportsgirl, once this dashboard is shared) could otherwise
    trigger a paid Apify/Anthropic run with one click. Re-add once weekly
    scheduled reporting is organised and self-serve triggering is wanted
    again. The backend routes (/api/admin/rerun, /rerun/cluster-only,
    /rerun/stop) are untouched -- still triggerable directly (e.g. curl)
    if you want to kick off a run yourself without exposing the buttons.
    Stop stays visible so an in-progress run (however it was started) can
    still be halted from here.
  -->
  <div id="runProgress" class="run-progress" style="display:none;">
    <div class="stage-row">
      <span class="stage-name" id="rpStageName">—</span>
      <span class="stage-count" id="rpStageCount"></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="rpBar" style="width:0%;"></div></div>
    <div class="steps" id="rpSteps"></div>
    <div class="detail" id="rpDetail"></div>
    <div class="status-line" id="rpStatus"></div>
    <div class="log" id="rpLog"></div>
  </div>

  <div class="tabs">
    <button data-tab="taxonomy" class="active">Taxonomy</button>
    <button data-tab="queries">Discovery queries</button>
    <button data-tab="config">Score weights &amp; thresholds</button>
    <button data-tab="products">Product catalogue</button>
    <button data-tab="audit">Audit log</button>
  </div>

  <div id="panel-taxonomy" class="panel">
    <div class="filters">
      <select id="taxCategory"><option value="beauty_tools_accessories">Beauty Tools &amp; Accessories</option><option value="cosmetics">Cosmetics</option><option value="beauty_gift_packs">Beauty Gift Packs</option><option value="all">All (exclusions/negatives)</option></select>
      <select id="taxType"><option value="include">Include</option><option value="exclude">Exclude</option><option value="negative_keyword">Negative keyword</option></select>
      <input id="taxTerm" placeholder="term…" />
      <button id="taxAdd" class="secondary">Add</button>
    </div>
    <table><thead><tr><th>Category</th><th>Term</th><th>Type</th><th>Active</th><th></th></tr></thead><tbody id="taxRows"></tbody></table>
  </div>

  <div id="panel-queries" class="panel" style="display:none;">
    <table><thead><tr><th>Platform</th><th>Type</th><th>Query</th><th>Status</th><th>Source</th><th>Active</th></tr></thead><tbody id="queryRows"></tbody></table>
  </div>

  <div id="panel-config" class="panel" style="display:none;">
    <div id="configRows"></div>
  </div>

  <div id="panel-products" class="panel" style="display:none;">
    <div class="filters">
      <input id="pSku" placeholder="SKU" style="width:120px;" /><input id="pName" placeholder="Name" style="width:200px;" />
      <input id="pCategory" placeholder="Category" style="width:140px;" /><input id="pPrice" placeholder="Price" style="width:80px;" />
      <button id="pAdd" class="secondary">Add / update product</button>
    </div>
    <table><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead><tbody id="productRows"></tbody></table>
  </div>

  <div id="panel-audit" class="panel" style="display:none;">
    <table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Reason</th></tr></thead><tbody id="auditRows"></tbody></table>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach((p) => p.style.display = p.id === `panel-${tab}` ? 'block' : 'none');
}

async function loadTaxonomy() {
  const rows = await api('/api/admin/taxonomy');
  document.getElementById('taxRows').innerHTML = rows.map((r) => `<tr>
    <td>${esc(r.parent_category)}</td><td>${esc(r.term)}</td><td>${esc(r.term_type)}</td>
    <td><input type="checkbox" ${r.active ? 'checked' : ''} onchange="toggleTax(${r.id}, this.checked)" /></td>
    <td><button class="secondary" onclick="deleteTax(${r.id})">Delete</button></td>
  </tr>`).join('');
}
async function toggleTax(id, active) { await api(`/api/admin/taxonomy/${id}`, { method: 'PATCH', body: { active } }); }
async function deleteTax(id) { await api(`/api/admin/taxonomy/${id}`, { method: 'DELETE' }); loadTaxonomy(); }

async function loadQueries() {
  const rows = await api('/api/admin/discovery-queries');
  document.getElementById('queryRows').innerHTML = rows.map((r) => `<tr>
    <td>${esc(r.platform)}</td><td>${esc(r.query_type)}</td><td>${esc(r.query_text)}</td>
    <td>${esc(r.status)} ${r.status === 'pending_review' ? `<button class="secondary" onclick="approveQuery(${r.id})">Approve</button>` : ''}</td>
    <td>${esc(r.source)}</td>
    <td><input type="checkbox" ${r.active ? 'checked' : ''} onchange="toggleQuery(${r.id}, this.checked)" /></td>
  </tr>`).join('');
}
async function toggleQuery(id, active) { await api(`/api/admin/discovery-queries/${id}`, { method: 'PATCH', body: { active } }); }
async function approveQuery(id) { await api(`/api/admin/discovery-queries/${id}`, { method: 'PATCH', body: { status: 'approved' } }); loadQueries(); }

async function loadConfig() {
  const rows = await api('/api/admin/config');
  document.getElementById('configRows').innerHTML = rows.map((r) => `<div class="card">
    <h3>${esc(r.key)}</h3>
    <textarea rows="6" id="cfg-${esc(r.key)}">${esc(JSON.stringify(r.value, null, 2))}</textarea>
    <div style="margin-top:8px;"><button class="secondary" onclick="saveConfig('${r.key}')">Save</button></div>
  </div>`).join('');
}
async function saveConfig(key) {
  const el = document.getElementById(`cfg-${key}`);
  try {
    const value = JSON.parse(el.value);
    await api(`/api/admin/config/${key}`, { method: 'PUT', body: { value } });
    alert('Saved.');
  } catch (err) {
    alert('Invalid JSON: ' + err.message);
  }
}

async function loadProducts() {
  const rows = await api('/api/admin/products');
  document.getElementById('productRows').innerHTML = rows.map((r) => `<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.category || '')}</td><td>${r.price ?? ''}</td><td>${esc(r.stock_status || '')}</td></tr>`).join('');
}

async function loadAudit() {
  const rows = await api('/api/admin/audit-log');
  document.getElementById('auditRows').innerHTML = rows.map((r) => `<tr><td>${fmtDate(r.created_at)}</td><td>${esc(r.user_email || '')}</td><td>${esc(r.action)}</td><td>${esc(r.entity_type || '')} ${r.entity_id ?? ''}</td><td>${esc(r.reason || '')}</td></tr>`).join('');
}

// Mirrors src/lib/runStatus.js STAGES -- display labels only.
const RUN_STAGES = [
  { key: 'tiktok', label: 'TikTok' },
  { key: 'instagram', label: 'Instagram' },
  { key: 'reddit', label: 'Reddit' },
  { key: 'clustering', label: 'Clustering' },
  { key: 'google_trends', label: 'Google Trends' },
  { key: 'scoring', label: 'Scoring' },
  { key: 'recommendations', label: 'Recommendations' }
];

let pollTimer = null;

function renderRunStatus(s) {
  const panel = document.getElementById('runProgress');
  // Nothing to show yet -- no run has ever been triggered this process.
  if (!s.running && !s.finishedAt && s.log.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';

  document.getElementById('rpStageName').textContent = s.running
    ? (s.stageLabel || 'Starting…')
    : (s.stopped ? 'Run stopped' : (s.error ? 'Run failed' : 'Last run finished'));
  document.getElementById('rpStageCount').textContent = s.total ? `${s.current} / ${s.total}` : '';

  const pct = s.total ? Math.min(100, Math.round((s.current / s.total) * 100)) : (s.running ? 5 : 100);
  document.getElementById('rpBar').style.width = pct + '%';

  document.getElementById('rpSteps').innerHTML = RUN_STAGES.map((stage, i) => {
    const cls = i < s.stageIndex ? 'done' : i === s.stageIndex ? 'active' : '';
    return `<span class="${cls}" title="${esc(stage.label)}"></span>`;
  }).join('');

  document.getElementById('rpDetail').textContent = s.detail || '';

  const statusEl = document.getElementById('rpStatus');
  if (s.running) {
    statusEl.textContent = s.stopRequested ? 'Stopping…' : '';
    statusEl.className = 'status-line';
  } else if (s.stopped) {
    statusEl.textContent = `Stopped at ${new Date(s.finishedAt).toLocaleTimeString('en-AU')}`;
    statusEl.className = 'status-line err';
  } else if (s.error) {
    statusEl.textContent = `Failed: ${s.error}`;
    statusEl.className = 'status-line err';
  } else if (s.finishedAt) {
    statusEl.textContent = `Completed at ${new Date(s.finishedAt).toLocaleTimeString('en-AU')}`;
    statusEl.className = 'status-line ok';
  } else {
    statusEl.textContent = '';
  }

  document.getElementById('rpLog').innerHTML = s.log.map((l) => `<div>${new Date(l.t).toLocaleTimeString('en-AU')} — ${esc(l.line)}</div>`).join('');

  document.getElementById('stopRun').style.display = s.running ? 'inline-block' : 'none';
  document.getElementById('stopRun').disabled = s.stopRequested;
  document.getElementById('stopRun').textContent = s.stopRequested ? 'Stopping…' : 'Stop run';
}

async function pollRunStatus() {
  let s;
  try {
    s = await api('/api/admin/rerun-status');
  } catch {
    return; // e.g. still starting up -- try again next tick
  }
  renderRunStatus(s);
  clearTimeout(pollTimer);
  if (s.running) pollTimer = setTimeout(pollRunStatus, 2000);
}

(async function () {
  const user = await initPage('/admin.html');
  if (user.role !== 'admin') {
    document.querySelector('.wrap').innerHTML = '<div class="empty">Admin access only.</div>';
    return;
  }

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  document.getElementById('taxAdd').addEventListener('click', async () => {
    const term = document.getElementById('taxTerm').value.trim();
    if (!term) return;
    await api('/api/admin/taxonomy', { method: 'POST', body: { parentCategory: document.getElementById('taxCategory').value, term, termType: document.getElementById('taxType').value } });
    document.getElementById('taxTerm').value = '';
    loadTaxonomy();
  });

  document.getElementById('pAdd').addEventListener('click', async () => {
    const sku = document.getElementById('pSku').value.trim(), name = document.getElementById('pName').value.trim();
    if (!sku || !name) return alert('SKU and name required.');
    await api('/api/admin/products', { method: 'POST', body: { sku, name, category: document.getElementById('pCategory').value, price: Number(document.getElementById('pPrice').value) || null } });
    loadProducts();
  });

  document.getElementById('stopRun').addEventListener('click', async () => {
    await api('/api/admin/rerun/stop', { method: 'POST' });
    pollRunStatus();
  });

  // Resume showing progress if a run is already in flight when this page loads
  // (e.g. triggered directly via the API -- see the comment near
  // #runProgress for why the trigger buttons themselves were removed).
  pollRunStatus();

  await Promise.all([loadTaxonomy(), loadQueries(), loadConfig(), loadProducts(), loadAudit()]);
})();
</script>
</body>
</html>
